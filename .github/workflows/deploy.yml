name: Deploy

on:
  push:
    branches: [main]

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    outputs:
      image_sha: ${{ steps.build-push.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        id: build-push
        env: 
          IMAGE_SHA: ${{ vars.DOCKERHUB_USER }}/todo-back:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ vars.DOCKERHUB_USER }}/todo-back:latest
        run: |
          docker buildx build --platform linux/amd64 -t $IMAGE_SHA -t $IMAGE_LATEST --push .
          echo "image_sha=$IMAGE_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Frontend image
        id: build-push
        env: 
          IMAGE_SHA: ${{ vars.DOCKERHUB_USER }}/todo-front:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ vars.DOCKERHUB_USER }}/todo-front:latest
        run: |
          docker buildx build --platform linux/amd64 -t $IMAGE_SHA -t $IMAGE_LATEST --push .
          echo "image_sha=$IMAGE_SHA" >> $GITHUB_OUTPUT



  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd dev-less

            # Берём имя образа из output предыдущего job'а — не дублируем
            sed -i "s|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ needs.build.outputs.image_sha }}|" .env
            docker compose pull backend
            # Перезапускаем только backend, не трогая frontend и db
            docker compose up -d --no-deps backend

  verify:
   needs: deploy
   runs-on: ubuntu-latest
   steps:
    - uses: actions/checkout@v4
    - name: Smoke
      env:
        E2E_BASE_URL: ${{ vars.VITE_API_URL }}
      run: |
        # vars.VITE_API_URL у нас вида https://домен/api → отрежем /api
        export E2E_BASE_URL="${E2E_BASE_URL%/api}"
        bash scripts/smoke.sh

  notify:
    needs: [checks, build, deploy, verify]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      checks_result: ${{ needs.checks.result}}
      deploy_result: ${{ needs.deploy.result}}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
